apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-backend
  namespace: sm-store
  labels:
    app.kubernetes.io/name: store-backend
    app.kubernetes.io/part-of: sm-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: store-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-backend
        app.kubernetes.io/part-of: sm-store
    spec:
      containers:
        - name: app
          image: ghcr.io/clm-cloud-solutions/sm-store-backend:a7c6414bdbc0f1df163bbf0ace65fb3233d954d9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: STORE_DB_URL
              value: "http://store-db:3000"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
